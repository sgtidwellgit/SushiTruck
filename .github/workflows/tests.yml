name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,websocket]"

      - name: Test
        run: python -m pytest --cov=sushitruck --cov-report=term-missing

  package:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Verify sdist contents match the allowlist
        run: |
          tar -tzf dist/*.tar.gz | sed 's|^[^/]*/||' | grep -v '/$' | sort > sdist-files.txt
          cat sdist-files.txt
          unexpected=$(grep -vE '^(src/sushitruck/|tests/|README\.md$|CHANGELOG\.md$|PROJECT\.md$|pyproject\.toml$|LICENSE$|PKG-INFO$|\.gitignore$)' sdist-files.txt || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected files in sdist:"
            echo "$unexpected"
            exit 1
          fi
